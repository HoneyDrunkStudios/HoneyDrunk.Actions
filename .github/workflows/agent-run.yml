# ==============================================================================
# Agent Run — Generic Reusable AI Agent Workflow
# ==============================================================================
# Purpose:
#   Reusable workflow that checks out HoneyDrunk.Studio and invokes an
#   AI agent (Claude Code Action or Codex) against it. Accepts either a named
#   agent definition (resolved to .claude/agents/{agent}.md in Studio)
#   or a direct prompt string.
#
#   This is the single entrypoint for all agent-driven work in the Grid.
#   D8 execution triggers, governance syncs, and any future agentic workflows
#   call this workflow rather than wiring their own AI invocations.
#
# Usage example (named agent):
#   jobs:
#     sync:
#       uses: HoneyDrunkStudios/HoneyDrunk.Actions/.github/workflows/agent-run.yml@main
#       with:
#         agent: initiatives-sync
#         provider: claude
#       secrets:
#         anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
#         github-token: ${{ secrets.INITIATIVES_SYNC_TOKEN }}
#
# Usage example (direct prompt):
#   jobs:
#     run:
#       uses: HoneyDrunkStudios/HoneyDrunk.Actions/.github/workflows/agent-run.yml@main
#       with:
#         prompt: 'Read catalogs/grid-health.json and summarise Node health as a PR comment.'
#       secrets:
#         anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
#         github-token: ${{ secrets.GITHUB_TOKEN }}
#
# Work-item creation and PR-body enforcement are retired.
# The optional legacy input is accepted only to give old callers a visible warning.
# ==============================================================================

name: Agent Run

on:
  workflow_call:
    inputs:
      provider:
        description: 'AI provider: claude | codex. Default: claude.'
        required: false
        type: string
        default: 'claude'
      agent:
        description: >-
          Agent name. Resolves to .claude/agents/{agent}.md in the Studio
          repo. When prompt is also supplied, it defines the authorized scope
          alongside the selected agent guidance.
        required: false
        type: string
        default: ''
      prompt:
        description: >-
          Explicitly authorized task scope. Used directly, or alongside agent
          guidance when an agent name is supplied.
        required: false
        type: string
        default: ''
      checkout-target:
        description: >-
          Optional second repo to checkout alongside Studio
          (e.g. HoneyDrunkStudios/HoneyDrunk.Vault). Checked out at path
          target-repo/ so the agent can read and write to it.
        required: false
        type: string
        default: ''
      allowed-tools:
        description: 'Comma-separated list of tools the agent may use.'
        required: false
        type: string
        default: 'Read,Grep,Glob,Edit,Write,Bash,TodoWrite'
      max-turns:
        description: 'Maximum agent turns before stopping.'
        required: false
        type: number
        default: 30
      model:
        description: >-
          Claude model ID to use (e.g. claude-haiku-4-5-20251001,
          claude-sonnet-4-6). Leave empty to use the action default (Sonnet).
        required: false
        type: string
        default: ''
      architecture-ref:
        description: 'Git ref of HoneyDrunk.Studio to checkout.'
        required: false
        type: string
        default: 'main'
      work-item-path:
        description: 'Deprecated compatibility input. Work-item linking and enforcement are retired; use prompt for the authorized scope.'
        required: false
        type: string
        default: ''
    secrets:
      anthropic-api-key:
        description: 'Anthropic API key. Required when provider=claude.'
        required: false
      openai-api-key:
        description: 'OpenAI API key. Required when provider=codex.'
        required: false
      github-token:
        description: >-
          Token with contents:write and pull-requests:write on Studio,
          plus issues:read on any repos whose issues the agent will query
          via the gh CLI.
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Studio
        uses: actions/checkout@v5
        with:
          repository: HoneyDrunkStudios/HoneyDrunk.Studio
          ref: ${{ inputs.architecture-ref }}
          token: ${{ secrets.github-token }}

      - name: Checkout target repo
        if: ${{ inputs.checkout-target != '' }}
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.checkout-target }}
          token: ${{ secrets.github-token }}
          path: target-repo

      - name: Configure git identity
        run: |
          git config user.name "hd-agent[bot]"
          git config user.email "hd-agent[bot]@honeydrunkstudios.dev"

      - name: Validate inputs
        env:
          PROVIDER: ${{ inputs.provider }}
          AGENT: ${{ inputs.agent }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          set -euo pipefail
          if [[ "${PROVIDER}" != "claude" && "${PROVIDER}" != "codex" ]]; then
            echo "::error::Unsupported provider '${PROVIDER}'. Must be 'claude' or 'codex'."
            exit 1
          fi
          if [[ -z "${AGENT}" && -z "${PROMPT}" ]]; then
            echo "::error::Either 'agent' or 'prompt' must be provided."
            exit 1
          fi

      - name: Resolve prompt
        id: resolve
        env:
          AGENT: ${{ inputs.agent }}
          PROMPT: ${{ inputs.prompt }}
          LEGACY_WORK_ITEM_PATH: ${{ inputs.work-item-path }}
        run: |
          set -euo pipefail
          if [[ -n "${LEGACY_WORK_ITEM_PATH}" ]]; then
            echo "::warning::work-item-path is retired and has no effect. Supply the explicitly authorized task in prompt."
          fi
          if [[ -n "${AGENT}" ]]; then
            FULL_PROMPT="You are the **${AGENT}** agent. Read your instructions from \`.claude/agents/${AGENT}.md\`. Follow only the explicitly authorized scope; historical plans and archived work items do not authorize execution."
            if [[ -n "${PROMPT}" ]]; then
              FULL_PROMPT="${FULL_PROMPT}

          ${PROMPT}"
            fi
          else
            FULL_PROMPT="${PROMPT}"
          fi
          {
            echo "prompt<<EOF_PROMPT"
            printf '%s' "${FULL_PROMPT}"
            echo ""
            echo "EOF_PROMPT"
          } >> "$GITHUB_OUTPUT"

      - name: Run agent — Claude
        if: ${{ inputs.provider == 'claude' || inputs.provider == '' }}
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.github-token }}
        with:
          prompt: ${{ steps.resolve.outputs.prompt }}
          anthropic_api_key: ${{ secrets.anthropic-api-key }}
          github_token: ${{ secrets.github-token }}
          claude_args: |
            --allowedTools ${{ inputs.allowed-tools }}
            --max-turns ${{ inputs.max-turns }}
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}

      - name: Run agent — Codex
        if: ${{ inputs.provider == 'codex' }}
        run: |
          # TODO: wire openai/codex-action once stable
          echo "::error::Codex provider is not yet wired. Use provider: claude."
          exit 1
