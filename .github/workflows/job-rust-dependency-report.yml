name: Rust Dependency Report

on:
  workflow_call:
    inputs:
      runs-on:
        description: GitHub runner to use.
        required: false
        type: string
        default: ubuntu-latest
      working-directory:
        description: Working directory for Cargo operations.
        required: false
        type: string
        default: .
      rust-toolchain:
        description: Rust toolchain to install.
        required: false
        type: string
        default: stable

permissions:
  contents: read

jobs:
  rust-dependency-report:
    name: Rust Dependency Report
    runs-on: ${{ inputs.runs-on }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${{ inputs.rust-toolchain }}" --profile minimal
          rustup default "${{ inputs.rust-toolchain }}"

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ inputs.working-directory }}/target
          key: rust-deps-${{ runner.os }}-${{ hashFiles(format('{0}/Cargo.lock', inputs.working-directory), format('{0}/**/Cargo.toml', inputs.working-directory)) }}
          restore-keys: |
            rust-deps-${{ runner.os }}-

      - name: Generate dependency reports
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          mkdir -p dependency-reports
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
          fi
          cargo metadata --format-version 1 > dependency-reports/cargo-metadata.json
          cargo tree --workspace > dependency-reports/cargo-tree.txt

      - name: Upload dependency report
        uses: actions/upload-artifact@v6
        with:
          name: rust-dependency-report
          path: ${{ inputs.working-directory }}/dependency-reports/**/*
          retention-days: 30
