name: Actions Repo CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    name: Lint workflows and secret policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          INSTALL_DIR="$RUNNER_TEMP/actionlint"
          mkdir -p "$INSTALL_DIR"
          case "$(uname -m)" in
            x86_64|amd64) ACTIONLINT_ARCH=amd64 ;;
            aarch64|arm64) ACTIONLINT_ARCH=arm64 ;;
            *) echo "::error::Unsupported runner architecture for actionlint: $(uname -m)"; exit 1 ;;
          esac
          ACTIONLINT_ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_${ACTIONLINT_ARCH}.tar.gz"
          curl -sSfL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ACTIONLINT_ARCHIVE}" \
            -o "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE"
          curl -sSfL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt" \
            -o "$RUNNER_TEMP/actionlint_checksums.txt"
          (cd "$RUNNER_TEMP" && grep "  ${ACTIONLINT_ARCHIVE}$" actionlint_checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE" -C "$INSTALL_DIR" actionlint
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Run actionlint
        shell: bash
        run: |
          set -euo pipefail
          actionlint -color -shellcheck=

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Check banned CI secret patterns
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < <(
            find .github/workflows .github/actions actions \
              -type f \( -name '*.yml' -o -name '*.yaml' \) \
              ! -path './.github/workflows/actions-ci.yml' \
              ! -path '.github/workflows/actions-ci.yml' \
              ! -name 'actions-ci.yml' \
              2>/dev/null || true
          )

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No workflow or action YAML files found."
            exit 0
          fi

          AZURE_SP_PATTERN='AZURE[_-]CLIENT[_-]SECRET|azure-client[-_]secret|client[-_]secret|client[S]ecret'
          LEGACY_TOKEN_PATTERN='NUGET_(API[_-]KEY|AUTH[_-]TOKEN)|(^|[^A-Z0-9_])(GH_PAT|GITHUB_PAT|PERSONAL_ACCESS_TOKEN|[A-Z0-9_]+_PAT_TOKEN)([^A-Z0-9_]|$)'
          BANNED_REGEX="${AZURE_SP_PATTERN}|AZURE[_-]CREDENTIALS|${LEGACY_TOKEN_PATTERN}"
          if grep -nE "$BANNED_REGEX" "${FILES[@]}" > banned-patterns.txt; then
            echo "::error::Banned direct-secret pattern found in workflow/action YAML. Use OIDC inputs or Key Vault resolution instead."
            cat banned-patterns.txt
            exit 1
          fi

          echo "No banned direct-secret patterns found."

      - name: Smoke test Grid Health aggregator
        shell: bash
        run: |
          set -euo pipefail
          tests/grid-health-aggregator-smoke.sh

      - name: Regression test release-note generation
        run: python3 -m unittest discover -s tests -p 'test_release_notes.py' -v

      - name: Set up Node for workflow regression fixtures
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Regression test Node workspace contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/node-workflow-tests"
          "$RUNNER_TEMP/node-workflow-tests/bin/python" -m pip install -r tests/requirements.txt
          "$RUNNER_TEMP/node-workflow-tests/bin/python" -m unittest discover -s tests -p 'test_node_workspace.py' -v

      - name: Regression test direct-request PR metadata
        run: python3 -m unittest discover -s tests -p 'test_pr_metadata.py' -v

      - name: Regression test coverage baseline ratchet
        run: python3 -m unittest discover -s tests -p 'test_coverage_baseline_ratchet.py' -v

      - name: Smoke test dependency scan workflow helper
        shell: bash
        run: |
          set -euo pipefail
          bash tests/dependency-scan-workflow-wiring-smoke.sh
          bash tests/dependency-scan-workflow-smoke.sh
          bash tests/dependency-scan-real-sdk-smoke.sh

      - name: Unit-test scripts (discord_notify redaction)
        shell: bash
        working-directory: .github/scripts
        run: |
          set -euo pipefail
          # Security-critical redaction + embed-budget logic for
          # job-discord-notify.yml (ADR-0084 D8). This is the gate that keeps the
          # runtime workflow thin — the reusable workflow trusts this script.
          python3 -m unittest test_discord_notify -v

  # Relative workflow calls use this exact repository revision, including PRs.
  # No consumer app, registry credential, deployed service, or device is needed.
  node-workspace-smoke:
    name: Node workflow smoke (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: npm-defaults
            package-manager-version: ''
            node-version-file: ''
          - profile: npm-pinned
            package-manager-version: '10.9.2'
            node-version-file: ../../.nvmrc
    uses: ./.github/workflows/job-node-workspace.yml
    with:
      working-directory: tests/fixtures/node-workspace/apps/web
      cache-dependency-path: ../../package-lock.json
      node-version-file: ${{ matrix.node-version-file }}
      package-manager-version: ${{ matrix.package-manager-version }}
      test-results-path: reports
      artifact-name: node-smoke-${{ matrix.profile }}
      artifact-retention-days: 1
      timeout-minutes: 10

  verify-node-workspace-smoke:
    name: Verify hosted Node evidence
    needs: [node-workspace-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download smoke evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: node-smoke-*-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: node-smoke-evidence

      - name: Verify uploaded outcomes, test results, and runtime versions
        shell: python
        run: |
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path('node-smoke-evidence')
          for profile in ('npm-defaults', 'npm-pinned'):
              artifacts = list(root.glob(f'node-smoke-{profile}-*'))
              assert len(artifacts) == 1, f'{profile}: expected one uploaded artifact'
              artifact = artifacts[0]
              results = json.loads((artifact / 'validation-results.json').read_text())
              assert not results['evidenceErrors'], results['evidenceErrors']
              for check in ('install', 'build', 'test', 'lint'):
                  assert results['checks'][check]['outcome'] == 'success', (profile, check)
              for check in ('typecheck', 'browser-install', 'accessibility', 'e2e'):
                  assert results['checks'][check]['outcome'] == 'skipped', (profile, check)
                  assert results['checks'][check]['requested'] is False, (profile, check)
              runtime = json.loads((artifact / 'test-results/runtime.json').read_text())
              assert runtime['node'].split('.')[0] == '22', runtime
              if profile == 'npm-pinned':
                  assert runtime['npm'] == '10.9.2', runtime
              junit = ET.parse(artifact / 'test-results/junit.xml')
              assert junit.findall('.//testcase'), f'{profile}: no executed tests in JUnit'
              assert not junit.findall('.//failure'), f'{profile}: JUnit reports failures'
              assert not junit.findall('.//error'), f'{profile}: JUnit reports errors'
              print(f'{profile}: uploaded outcomes and JUnit verified; Node {runtime["node"]}, npm {runtime["npm"]}')
