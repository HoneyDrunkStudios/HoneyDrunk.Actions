# ==============================================================================
# SonarQube Cloud Static Analysis Job (Tier 2)
# ==============================================================================
# Purpose:
#   Run SonarQube Cloud (formerly SonarCloud — rebrand 2026) static analysis
#   on a .NET repo using `dotnet-sonarscanner`. Reuses the coverage artifact
#   from `job-build-and-test.yml`, publishes coverage to SonarQube Cloud,
#   and waits for the server-side quality gate before reporting success.
#
# Tier:
#   Tier 2 of the ADR-0011 PR review pipeline. Required check on public repos
#   per ADR-0011 D11.
#
# CALLER TRIGGER CONTRACT (load-bearing — read this if you are wiring a new caller):
#   This workflow is `workflow_call`-only. It MUST only be invoked from a
#   caller workflow whose `on:` block fires on `pull_request` events or `push`
#   events to `main` — not on every feature-branch push, not on tags, not on
#   schedule, not on workflow_dispatch from arbitrary refs.
#
#   The job below carries an `if:` guard that refuses to run when this
#   constraint is violated, so a misconfigured caller will produce a no-op
#   skipped job rather than burning a SonarQube Cloud run on every
#   feature-branch push. Per ADR-0011 D11 cost discipline.
#
# Cost discipline:
#   - pull_request and push:main only — enforced by both the caller's `on:`
#     block AND the job-level `if:` guard below
#   - Median PR run target: under 60 seconds
#   - Coverage report reused from `job-build-and-test.yml` artifact (no second
#     `dotnet test` run)
#   - Confirm the organization's current plan and private LOC capacity before
#     onboarding. Free includes private capacity; do not infer a paid requirement.
#
# Secret:
#   SONAR_TOKEN — provisioned as a GitHub org secret with `Selected repositories`
#   scope. Provisioning lives in `infrastructure/walkthroughs/sonarcloud-organization-setup.md`
#   in HoneyDrunk.Studio. Respect the token's actual expiry choice; inactivity
#   removal is separate from expiration. Never print or persist its value.
#
# Single Responsibility:
#   Reuses `job-build-and-test.yml`'s coverage artifact, or collects coverage
#   when it is absent. Fails on server processing errors, quality-gate failure,
#   or timeout. The external `SonarCloud Code Analysis` check still requires a
#   correctly bound GitHub project/App and remains a separate required check.
#   A passed quality gate does not establish zero new issues: inspect the actual
#   findings for the analyzed PR head before calling it ready.
#
# Non-goals:
#   Vulnerability scanning (see `job-dependency-scan.yml`), CodeQL SAST (see
#   `job-codeql.yml`), secret scanning (see `job-secret-scan.yml`), analyzers
#   and formatting (see `job-static-analysis.yml`).
# ==============================================================================

name: SonarQube Cloud (Job)

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: 'The .NET SDK version to use'
        required: false
        type: string
        default: '10.0.x'

      runs-on:
        description: 'GitHub runner to use'
        required: false
        type: string
        default: 'ubuntu-latest'

      working-directory:
        description: 'Working directory for build (inner project subdir, NOT git root)'
        required: false
        type: string
        default: '.'

      project-path:
        description: 'Path to solution or project file (auto-detected if not specified)'
        required: false
        type: string
        default: ''

      sonar-organization:
        description: 'SonarQube Cloud organization key (e.g. honeydrunkstudios)'
        required: true
        type: string

      sonar-project-key:
        description: 'SonarQube Cloud project key (e.g. honeydrunkstudios_HoneyDrunk.Kernel)'
        required: true
        type: string

      sonar-host-url:
        description: 'SonarQube Cloud host URL'
        required: false
        type: string
        default: 'https://sonarcloud.io'

      coverage-artifact-name:
        description: 'Name of the coverage artifact uploaded by job-build-and-test.yml'
        required: false
        type: string
        default: 'coverage-reports-ubuntu-latest'

      coverage-runsettings:
        description: 'Optional runsettings file to use as the base for push:main fallback coverage collection. When omitted, coverlet.runsettings in the working directory is used if present.'
        required: false
        type: string
        default: ''

      generic-coverage-report-path:
        description: 'Optional existing Sonar generic coverage XML file, relative to working-directory. Supply measured non-.NET coverage in the downloaded artifact; missing requested files fail analysis.'
        required: false
        type: string
        default: ''

      sonar-exclusions:
        description: 'Comma-separated SonarQube Cloud source exclusions. Defaults exclude consumer workflow wrapper YAML; workflow security is reviewed in HoneyDrunk.Actions.'
        required: false
        type: string
        default: '.github/workflows/**'

      sonar-tsql:
        description: 'Analyze .sql and .tsql as Microsoft T-SQL; retain .plsql/.pks/.pkb for Oracle PL/SQL. Opt in only for SQL Server repositories.'
        required: false
        type: boolean
        default: false

      collect-failure-findings:
        description: 'Collect zero-threshold PR findings after a failed scanner only when this run completed analysis. Same-repository PRs on sonarcloud.io only; scanner failure remains blocking.'
        required: false
        type: boolean
        default: false

    secrets:
      sonar-token:
        description: 'SONAR_TOKEN — GitHub org secret scoped to HoneyDrunkStudios. Provisioning lives in HoneyDrunk.Studio/infrastructure/walkthroughs/sonarcloud-organization-setup.md.'
        required: true
      github-token:
        description: 'GitHub token for PR decoration (falls back to github.token if not supplied)'
        required: false

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  sonarcloud:
    name: SonarQube Cloud
    runs-on: ${{ inputs.runs-on }}
    # Trigger guard — defence in depth for ADR-0011 D11 cost discipline.
    # Refuses to run when invoked from a misconfigured caller. The expected
    # caller `on:` block is `pull_request` and `push: branches: [main]`.
    # If a caller wires this workflow into a feature-branch push or a tag,
    # this guard reports a skipped job rather than spending a SonarQube Cloud run.
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

    outputs:
      analysis-completed: ${{ steps.completion.outputs.analysis-completed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # SonarQube Cloud requires full git history for blame attribution

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Set up Java (required by Sonar Scanner)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v5
        with:
          # Scanner cached at workspace root so the absolute
          # $GITHUB_WORKSPACE/.sonar/scanner path resolves regardless of the
          # caller's working-directory (which may be an inner subdir like
          # 'HoneyDrunk.Kernel/' for Pattern A consumer repos).
          path: ${{ github.workspace }}/.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/.sonar/scanner"
          dotnet tool update dotnet-sonarscanner --tool-path "${GITHUB_WORKSPACE}/.sonar/scanner"

      - name: Download coverage artifact (if exists)
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.coverage-artifact-name }}
          # Download into the caller's working-directory so the
          # `**/coverage.opencover.xml` glob passed to the scanner resolves
          # against the same root the scanner runs from.
          path: ${{ inputs.working-directory }}/TestResults
        continue-on-error: true

      - name: Prepare analysis completion evidence
        id: analysis-metadata
        if: inputs.collect-failure-findings && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        shell: bash
        run: |
          # Never follow a host supplied by scanner metadata with credentials.
          if [[ "${SONAR_HOST_URL}" != 'https://sonarcloud.io' ]]; then
            echo '::error::Failure findings require https://sonarcloud.io.'
            exit 1
          fi
          directory="$(mktemp -d "${RUNNER_TEMP}/sonar-completion.XXXXXX")"
          echo "report-path=${directory}/report-task.txt" >> "$GITHUB_OUTPUT"

      - name: Begin SonarQube Cloud analysis
        working-directory: ${{ inputs.working-directory }}
        env:
          SONAR_TOKEN: ${{ secrets.sonar-token }}
          GITHUB_TOKEN: ${{ secrets.github-token || github.token }}
          SONAR_TSQL: ${{ inputs.sonar-tsql }}
          GENERIC_COVERAGE_REPORT: ${{ inputs.generic-coverage-report-path }}
          SONAR_REPORT_PATH: ${{ steps.analysis-metadata.outputs.report-path }}
        shell: bash
        run: |
          # SonarScanner for .NET reads sonar.* configuration via `/d:` CLI flags or
          # MSBuild `<SonarQubeSetting>` items — NOT via `sonar-project.properties`
          # (a generic SonarScanner CLI convention the .NET scanner rejects).
          # The coverage report path must be passed explicitly here so the scanner
          # imports the OpenCover report produced by the conversion step below.
          # Per-repo overrides are possible via MSBuild `<SonarQubeSetting>` items
          # in Directory.Build.props if a repo needs to diverge from the default.
          metadata_arguments=()
          if [[ -n "${SONAR_REPORT_PATH:-}" ]]; then
            metadata_arguments+=("/d:sonar.scanner.metadataFilePath=${SONAR_REPORT_PATH}")
          fi
          sql_arguments=()
          if [[ "${SONAR_TSQL}" == 'true' ]]; then
            # Sonar defaults .sql to Oracle PL/SQL. Associate it with exactly
            # one dialect; this changes the parser, not the analysis scope.
            sql_arguments+=(/d:sonar.tsql.file.suffixes=.sql,.tsql)
            sql_arguments+=(/d:sonar.plsql.file.suffixes=.plsql,.pks,.pkb)
          fi
          coverage_arguments=()
          if [[ -n "${GENERIC_COVERAGE_REPORT}" ]]; then
            if [[ ! -f "${GENERIC_COVERAGE_REPORT}" ]]; then
              echo '::error::The requested generic coverage report is missing.'
              exit 1
            fi
            coverage_arguments+=("/d:sonar.coverageReportPaths=${GENERIC_COVERAGE_REPORT}")
          fi
          "${GITHUB_WORKSPACE}/.sonar/scanner/dotnet-sonarscanner" begin \
            "${metadata_arguments[@]}" \
            "${sql_arguments[@]}" \
            "${coverage_arguments[@]}" \
            /k:"${{ inputs.sonar-project-key }}" \
            /o:"${{ inputs.sonar-organization }}" \
            /d:sonar.host.url="${{ inputs.sonar-host-url }}" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=300 \
            /d:sonar.exclusions="${{ inputs.sonar-exclusions }}" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.project-path }}" ]; then
            dotnet build "${{ inputs.project-path }}" --configuration Release
          else
            dotnet build --configuration Release
          fi

      - name: Generate coverage (push:main fallback when no artifact was downloaded)
        working-directory: ${{ inputs.working-directory }}
        env:
          COVERAGE_RUNSETTINGS: ${{ inputs.coverage-runsettings }}
        shell: bash
        run: |
          set -euo pipefail
          # PR runs reuse the coverage artifact produced by the caller's pr-core
          # job (per ADR-0011 D11 cost discipline — no double `dotnet test`).
          # On push:main runs there is no pr-core (it's gated to pull_request),
          # so no upstream test job runs, so no artifact exists. Without coverage
          # here, the SonarCloud Overview dashboard's coverage metric stays 0%
          # forever and the leak-period baseline has no coverage to compare against.
          #
          # If the download step produced an OpenCover file, skip — PR path already
          # has what the scanner needs. Otherwise, run `dotnet test` with a coverlet
          # runsettings that emits OpenCover natively, so the main-branch analysis
          # has real data to report. ReportGenerator's OpenCover output is paid-only,
          # so post-hoc Cobertura→OpenCover conversion is not viable.
          if find ./TestResults -name "coverage.opencover.xml" 2>/dev/null | head -1 | grep -q .; then
            echo "::notice::OpenCover artifact found from caller (likely a PR run with pr-core); skipping local test execution."
            exit 0
          fi
          echo "::notice::No OpenCover artifact found (likely a push:main run); running tests with coverage so SonarCloud receives baseline data."
          RUNSETTINGS="$(pwd)/TestResults/coverlet.runsettings"
          mkdir -p "$(pwd)/TestResults"
          BASE_RUNSETTINGS="${COVERAGE_RUNSETTINGS:-}"
          if [ -z "$BASE_RUNSETTINGS" ] && [ -f "coverlet.runsettings" ]; then
            BASE_RUNSETTINGS="$(pwd)/coverlet.runsettings"
          fi
          if [ -n "$BASE_RUNSETTINGS" ] && [ ! -f "$BASE_RUNSETTINGS" ]; then
            echo "::error::coverage-runsettings was provided but does not exist: $BASE_RUNSETTINGS"
            exit 1
          fi
          export RUNSETTINGS BASE_RUNSETTINGS
          python3 <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          target = Path(os.environ["RUNSETTINGS"])
          base = os.environ.get("BASE_RUNSETTINGS") or ""

          def child(parent, name):
              for item in list(parent):
                  if item.tag.split("}", 1)[-1] == name:
                      return item
              return None

          if base:
              tree = ET.parse(base)
              root = tree.getroot()
              print(f"Using coverage runsettings base: {base}")
          else:
              root = ET.Element("RunSettings")
              tree = ET.ElementTree(root)
              print("No coverage runsettings base found; generating default coverlet settings.")

          dc_settings = child(root, "DataCollectionRunSettings")
          if dc_settings is None:
              dc_settings = ET.SubElement(root, "DataCollectionRunSettings")
          collectors = child(dc_settings, "DataCollectors")
          if collectors is None:
              collectors = ET.SubElement(dc_settings, "DataCollectors")
          collector = None
          for item in list(collectors):
              if item.tag.split("}", 1)[-1] == "DataCollector" and item.attrib.get("friendlyName") == "XPlat Code Coverage":
                  collector = item
                  break
          if collector is None:
              collector = ET.SubElement(collectors, "DataCollector", {"friendlyName": "XPlat Code Coverage"})
          config = child(collector, "Configuration")
          if config is None:
              config = ET.SubElement(collector, "Configuration")
          fmt = child(config, "Format")
          if fmt is None:
              fmt = ET.SubElement(config, "Format")
              existing = []
          else:
              existing = [part.strip() for part in (fmt.text or "").split(",") if part.strip()]

          merged = []
          seen = set()
          for part in existing + ["opencover", "cobertura"]:
              key = part.lower()
              if key not in seen:
                  seen.add(key)
                  merged.append(part)
          fmt.text = ",".join(merged)

          ET.indent(tree, space="  ")
          target.parent.mkdir(parents=True, exist_ok=True)
          tree.write(target, encoding="utf-8", xml_declaration=True)
          PY
          TEST_ARGS=(
            "--collect" "XPlat Code Coverage"
            "--settings" "$RUNSETTINGS"
            "--results-directory" "./TestResults"
            "--configuration" "Release"
            "--no-build"
          )
          if [ -n "${{ inputs.project-path }}" ]; then
            dotnet test "${{ inputs.project-path }}" "${TEST_ARGS[@]}"
          else
            dotnet test "${TEST_ARGS[@]}"
          fi

      - name: End SonarQube Cloud analysis
        id: scanner-end
        working-directory: ${{ inputs.working-directory }}
        env:
          SONAR_TOKEN: ${{ secrets.sonar-token }}
          SONAR_REPORT_PATH: ${{ steps.analysis-metadata.outputs.report-path }}
        shell: bash
        run: |
          # Remove any file left by build/test code before the scanner upload.
          if [[ -n "${SONAR_REPORT_PATH:-}" ]]; then
            rm -f -- "$SONAR_REPORT_PATH"
          fi
          echo "started-at=$(date +%s)" >> "$GITHUB_OUTPUT"
          set +e
          "${GITHUB_WORKSPACE}/.sonar/scanner/dotnet-sonarscanner" end /d:sonar.token="${SONAR_TOKEN}"
          result=$?
          echo "finished-at=$(date +%s)" >> "$GITHUB_OUTPUT"
          exit "$result"

      - name: Verify completed analysis after scanner failure
        id: completion
        if: ${{ !cancelled() && inputs.collect-failure-findings && steps.scanner-end.outcome == 'failure' && steps.analysis-metadata.outcome == 'success' }}
        env:
          SONAR_TOKEN: ${{ secrets.sonar-token }}
          SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
          SONAR_PROJECT_KEY: ${{ inputs.sonar-project-key }}
          SONAR_REPORT_PATH: ${{ steps.analysis-metadata.outputs.report-path }}
          SCANNER_STARTED_AT: ${{ steps.scanner-end.outputs.started-at }}
          SCANNER_FINISHED_AT: ${{ steps.scanner-end.outputs.finished-at }}
        shell: bash
        run: |
          python3 <<'PYTHON'
          from datetime import datetime
          import json
          import os
          from pathlib import Path
          import re
          import urllib.parse
          import urllib.request

          # One bounded read, not a second processing wait. Pending, timeout,
          # malformed or absent evidence cannot enable PR metric queries.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def completed():
              host = os.environ['SONAR_HOST_URL']
              if host != 'https://sonarcloud.io':
                  return False
              started = int(os.environ['SCANNER_STARTED_AT'])
              finished = int(os.environ['SCANNER_FINISHED_AT'])
              if not 0 < started <= finished:
                  return False
              report = Path(os.environ['SONAR_REPORT_PATH'])
              if report.is_symlink() or not report.is_file():
                  return False
              if not started <= report.stat().st_mtime < finished + 1:
                  return False
              if report.stat().st_size > 16384:
                  return False
              metadata = {}
              for line in report.read_text(encoding='utf-8').splitlines():
                  key, separator, value = line.partition('=')
                  if not separator or key in metadata:
                      return False
                  metadata[key] = value
              task_id = metadata.get('ceTaskId', '')
              if not re.fullmatch(r'[A-Za-z0-9_-]{1,128}', task_id):
                  return False
              project = os.environ['SONAR_PROJECT_KEY']
              if metadata.get('serverUrl') != host or metadata.get('projectKey') != project:
                  return False
              url = host + '/api/ce/task?' + urllib.parse.urlencode({'id': task_id})
              if metadata.get('ceTaskUrl') != url:
                  return False
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['SONAR_TOKEN'],
                  'Accept': 'application/json',
              })
              with urllib.request.build_opener(NoRedirect).open(request, timeout=10) as response:
                  payload = json.loads(response.read(65537))
              task = payload['task']
              if (task['id'] != task_id or task['componentKey'] != project
                      or task['status'] != 'SUCCESS'
                      or not re.fullmatch(r'[A-Za-z0-9_-]{1,128}', task.get('analysisId', ''))):
                  return False
              submitted = datetime.fromisoformat(task['submittedAt'].replace('Z', '+00:00'))
              executed = datetime.fromisoformat(task['executedAt'].replace('Z', '+00:00'))
              if submitted.tzinfo is None or executed.tzinfo is None:
                  return False
              return started <= submitted.timestamp() <= executed.timestamp() < finished + 1

          try:
              verified = completed()
          except (OSError, ValueError, KeyError, TypeError, AttributeError):
              verified = False
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('analysis-completed=' + str(verified).lower() + '\n')
          print('::notice::Current scanner analysis completion verified: ' + str(verified).lower())
          PYTHON

  failure-findings:
    name: Findings after failed quality gate
    needs: sonarcloud
    if: ${{ always() && !cancelled() && inputs.collect-failure-findings && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.sonarcloud.result == 'failure' && needs.sonarcloud.outputs.analysis-completed == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/job-sonarcloud-quality-gate.yml
    with:
      runs-on: ${{ inputs.runs-on }}
      sonar-organization: ${{ inputs.sonar-organization }}
      sonar-project-key: ${{ inputs.sonar-project-key }}
      sonar-host-url: ${{ inputs.sonar-host-url }}
      mode: enforce
    secrets:
      sonar-token: ${{ secrets.sonar-token }}
