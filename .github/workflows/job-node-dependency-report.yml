name: Node Dependency Report

on:
  workflow_call:
    inputs:
      runs-on:
        description: GitHub runner to use.
        required: false
        type: string
        default: ubuntu-latest
      working-directory:
        description: Working directory for Node operations.
        required: false
        type: string
        default: .
      node-version:
        description: Node.js version to install when node-version-file is empty.
        required: false
        type: string
        default: '22'
      node-version-file:
        description: Optional path to a Node version file, relative to working-directory.
        required: false
        type: string
        default: ''
      package-manager:
        description: Package manager cache mode supported by actions/setup-node.
        required: false
        type: string
        default: npm
      cache-dependency-path:
        description: Dependency lockfile path used for setup-node cache.
        required: false
        type: string
        default: package-lock.json
      install-command:
        description: Command used to install dependencies before reporting.
        required: false
        type: string
        default: npm ci
      outdated-command:
        description: Command used to generate the outdated dependency report.
        required: false
        type: string
        default: npm outdated --workspaces --json

permissions:
  contents: read

jobs:
  node-dependency-report:
    name: Node Dependency Report
    runs-on: ${{ inputs.runs-on }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js from version file
        if: ${{ inputs.node-version-file != '' }}
        uses: actions/setup-node@v5
        with:
          node-version-file: ${{ inputs.working-directory }}/${{ inputs.node-version-file }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.cache-dependency-path }}

      - name: Setup Node.js from version input
        if: ${{ inputs.node-version-file == '' }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.cache-dependency-path }}

      - name: Install dependencies
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}

      - name: Generate dependency report
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          set +e
          mkdir -p dependency-reports
          ${{ inputs.outdated-command }} > dependency-reports/node-outdated.json
          status=$?
          if [ "$status" -gt 1 ]; then
            echo "::warning::Node outdated command exited with $status"
          fi
          cat dependency-reports/node-outdated.json
          exit 0

      - name: Upload dependency report
        uses: actions/upload-artifact@v6
        with:
          name: node-dependency-report
          path: ${{ inputs.working-directory }}/dependency-reports/node-outdated.json
          retention-days: 30
