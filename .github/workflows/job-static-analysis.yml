# ==============================================================================
# Static Analysis Job
# ==============================================================================
# Purpose:
#   Run static analysis checks: code formatting and test naming validation.
#   Vulnerable-package scanning lives in job-dependency-scan.yml.
#
# Single Responsibility:
#   Static code analysis only - no building or testing
# ==============================================================================

name: Static Analysis (Job)

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: 'The .NET SDK version to use'
        required: false
        type: string
        default: '10.0.x'
      
      runs-on:
        description: 'GitHub runner to use'
        required: false
        type: string
        default: 'ubuntu-latest'
      
      working-directory:
        description: 'Working directory for operations'
        required: false
        type: string
        default: '.'
      
      project-path:
        description: 'Path to solution or project file'
        required: false
        type: string
        default: ''
      
      check-formatting:
        description: 'Check code formatting'
        required: false
        type: boolean
        default: true
      
      fail-on-formatting-issues:
        description: 'Fail build on formatting issues'
        required: false
        type: boolean
        default: false
      
      validate-test-naming:
        description: 'Validate test naming conventions'
        required: false
        type: boolean
        default: true
      
      actions-ref:
        description: 'Git ref of HoneyDrunk.Actions to use (should match the version of this workflow)'
        required: false
        type: string
        default: 'main'
    
    outputs:
      has-warnings:
        description: 'Whether warnings were detected'
        value: ${{ jobs.static-analysis.outputs.has-warnings }}
      warning-messages:
        description: 'List of warning messages'
        value: ${{ jobs.static-analysis.outputs.warning-messages }}

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ${{ inputs.runs-on }}
    outputs:
      has-warnings: ${{ steps.check-warnings.outputs.has-warnings }}
      warning-messages: ${{ steps.check-warnings.outputs.warning-messages }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Checkout HoneyDrunk.Actions
        uses: actions/checkout@v5
        with:
          repository: HoneyDrunkStudios/HoneyDrunk.Actions
          path: .github/actions-repo
          ref: ${{ inputs.actions-ref }}
      
      - name: Setup .NET SDK
        uses: ./.github/actions-repo/.github/actions/dotnet/setup
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      
      - name: Restore dependencies
        uses: ./.github/actions-repo/.github/actions/dotnet/restore
        with:
          working-directory: ${{ inputs.working-directory }}
          project-path: ${{ inputs.project-path }}
      
      - name: Check code formatting
        id: formatting
        if: ${{ inputs.check-formatting }}
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          FORMAT_PROJECT_PATH: ${{ inputs.project-path }}
          FAIL_ON_FORMATTING_ISSUES: ${{ inputs.fail-on-formatting-issues }}
        run: |
          echo "Checking code formatting..."
          FORMAT_ARGS=(--verify-no-changes --verbosity diagnostic)
          if [ -n "$FORMAT_PROJECT_PATH" ]; then
            FORMAT_ARGS=("$FORMAT_PROJECT_PATH" "${FORMAT_ARGS[@]}")
          fi
          if dotnet format "${FORMAT_ARGS[@]}"; then
            echo "has-issue=false" >> "$GITHUB_OUTPUT"
          else
            FORMAT_STATUS=$?
            # Exit 2 is the formatter's changes-needed result. Invocation/workspace
            # failures must never be downgraded into an advisory formatting warning.
            if [ "$FAIL_ON_FORMATTING_ISSUES" = "true" ] || [ "$FORMAT_STATUS" -ne 2 ]; then
              echo "::error::dotnet format failed (exit $FORMAT_STATUS). See formatter diagnostics above."
              exit "$FORMAT_STATUS"
            else
              echo "::warning::Code formatting issues detected. Run 'dotnet format' to fix."
              echo "has-issue=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      
      - name: Validate test naming conventions
        if: ${{ inputs.validate-test-naming }}
        continue-on-error: true
        uses: ./.github/actions-repo/.github/actions/diagnostics/validate-test-naming
        with:
          test-directory: ${{ inputs.working-directory }}
      
      - name: Check for warnings
        id: check-warnings
        if: always()
        shell: bash
        run: |
          HAS_WARNINGS="false"
          WARNINGS=""
          
          # Only check formatting output if the formatting step actually ran
          if [ "${{ inputs.check-formatting }}" = "true" ] && [ "${{ steps.formatting.outputs.has-issue }}" = "true" ]; then
            HAS_WARNINGS="true"
            WARNINGS="Code formatting issues detected. Run 'dotnet format' to fix."
          fi
          
          echo "has-warnings=$HAS_WARNINGS" >> $GITHUB_OUTPUT
          echo "warning-messages=$WARNINGS" >> $GITHUB_OUTPUT
