# ==============================================================================
# Nightly Security Workflow
# ==============================================================================
# Purpose:
#   Deep, comprehensive security scanning run on a schedule.
#   Performs thorough analysis that is too expensive for PR workflows.
#
# Responsibilities:
#   - Run deep SAST (Static Application Security Testing)
#   - Run full dependency vulnerability scan (including transitive deps)
#   - Run infrastructure as code (IaC) security checks
#   - Detect secrets and credentials in entire codebase
#   - Generate security report artifacts
#   - Optionally create/update security issues
#
# Target:
#   All repos in the HoneyDrunk Grid
#
# Triggers:
#   - This workflow is reusable via workflow_call
#   - Consuming repos should trigger on schedule (e.g., cron: '0 2 * * *')
#   - Can also be triggered manually via workflow_dispatch
#
# Permission contract:
#   ADR-0012 D5 keeps effective reusable-workflow token scopes caller-owned.
#   docs/consumer-usage.md is the canonical caller permission baseline for this
#   workflow: actions: read, contents: read, security-events: write, and
#   issues: write. This workflow omits a top-level permissions block so the
#   runtime implementation does not imply callee-owned token scope. Remove the
#   degraded actions: read path after callers have adopted the baseline.
#
# Usage Example:
#   See docs/consumer-usage.md for sample consumer workflows
# ==============================================================================

name: Nightly Security

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: 'The .NET SDK version to use'
        required: false
        type: string
        default: '10.0.x'
      
      runs-on:
        description: 'GitHub runner to use'
        required: false
        type: string
        default: 'ubuntu-latest'
      
      working-directory:
        description: 'Working directory for all operations'
        required: false
        type: string
        default: '.'
      
      project-path:
        description: 'Path to solution or project file (auto-detected if not specified)'
        required: false
        type: string
        default: ''
      
      enable-sast:
        description: 'Run deep SAST analysis'
        required: false
        type: boolean
        default: true
      
      enable-iac-scan:
        description: 'Scan infrastructure as code files (Terraform, ARM, etc.)'
        required: false
        type: boolean
        default: true
      
      enable-secret-scan:
        description: 'Scan entire codebase for secrets'
        required: false
        type: boolean
        default: true
      
      fail-on-high-severity:
        description: 'Also fail on high severity; critical and dependency findings always block'
        required: false
        type: boolean
        default: false
      
      create-issues:
        description: 'Create GitHub issues for security findings'
        required: false
        type: boolean
        default: false
      
      actions-ref:
        description: 'Git ref of HoneyDrunk.Actions to use'
        required: false
        type: string
        default: 'main'
    
    secrets:
      github-token:
        description: >-
          PAT for creating/updating issues (the create-issues feature).
          Falls back to github.token when not provided.
          Note: the permissions block below scopes github.token only;
          if a PAT is passed here, its scopes are managed at the token level.
        required: false

jobs:
  dependency-scan:
    name: Deep Dependency Vulnerability Scan
    runs-on: ${{ inputs.runs-on }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Checkout HoneyDrunk.Actions
        uses: actions/checkout@v5
        with:
          repository: HoneyDrunkStudios/HoneyDrunk.Actions
          path: .github/actions-repo
          ref: ${{ inputs.actions-ref }}
      
      - name: Setup .NET SDK
        id: setup
        uses: ./.github/actions-repo/.github/actions/dotnet/setup
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      
      - name: Restore dependencies
        id: restore
        continue-on-error: true
        uses: ./.github/actions-repo/.github/actions/dotnet/restore
        with:
          working-directory: ${{ inputs.working-directory }}
          project-path: ${{ inputs.project-path }}

      - name: Run comprehensive vulnerability scan
        id: vulnerability-scan
        if: always() && steps.setup.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions-repo/.github/actions/security/vulnerability-scan
        with:
          working-directory: ${{ inputs.working-directory }}
          project-path: ${{ inputs.project-path }}
          # Preserve the effective NU1901–NU1904 warnings-as-errors policy.
          # Findings are collected first and enforced by the final gate.
          fail-on-severity: low

      - name: Record dependency execution status
        if: always()
        shell: bash
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          SCAN_OUTCOME: ${{ steps.vulnerability-scan.outcome }}
          REPORT_DIRECTORY: ${{ inputs.working-directory }}/security-reports
        run: |
          mkdir -p "$REPORT_DIRECTORY"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          path = Path(os.environ['REPORT_DIRECTORY']) / 'execution.json'
          path.write_text(json.dumps({
              'restore': os.environ['RESTORE_OUTCOME'],
              'scan': os.environ['SCAN_OUTCOME'],
          }) + '\n', encoding='utf-8')
          PYTHON

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vulnerability-report
          path: ${{ inputs.working-directory }}/security-reports/**/*
          if-no-files-found: error
          retention-days: 90

  sast-analysis:
    name: Deep SAST Analysis
    if: ${{ inputs.enable-sast }}
    runs-on: ${{ inputs.runs-on }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout HoneyDrunk.Actions
        uses: actions/checkout@v5
        with:
          repository: HoneyDrunkStudios/HoneyDrunk.Actions
          path: .github/actions-repo
          ref: ${{ inputs.actions-ref }}

      - name: Resolve CodeQL config
        id: codeql-config
        shell: bash
        run: |
          # Prefer a repo-local config; otherwise fall back to the shared
          # default shipped by HoneyDrunk.Actions.
          if [ -f "./.github/codeql/codeql-config.yml" ]; then
            echo "path=./.github/codeql/codeql-config.yml" >> $GITHUB_OUTPUT
          elif [ -f "./.github/codeql/codeql-config.yaml" ]; then
            echo "path=./.github/codeql/codeql-config.yaml" >> $GITHUB_OUTPUT
          else
            echo "path=./.github/actions-repo/.github/codeql/codeql-config.yml" >> $GITHUB_OUTPUT
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-and-quality
          config-file: ${{ steps.codeql-config.outputs.path }}

      - name: Setup .NET SDK
        uses: ./.github/actions-repo/.github/actions/dotnet/setup
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Build for CodeQL analysis
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          PROJECT_PATH: ${{ inputs.project-path }}
        run: |
          mkdir -p security-reports
          PROJECT="$PROJECT_PATH"
          if [ -z "$PROJECT" ]; then
            PROJECT=$(find . -maxdepth 2 \( -name '*.slnx' -o -name '*.sln' \) | head -1)
          fi
          # Keep audit diagnostics visible while allowing CodeQL extraction.
          # The final gate blocks every dependency vulnerability severity.
          dotnet build "$PROJECT" --no-incremental \
            '-p:WarningsNotAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904' \
            2>&1 | tee security-reports/codeql-build.log

      - name: Check workflow-run metadata permission
        id: workflow-run-permission
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Capture stderr from gh while discarding the successful JSON body.
          if output=$(gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" 2>&1 >/dev/null); then
            echo "has_actions_read=true" >> "$GITHUB_OUTPUT"
            {
              echo "## CodeQL workflow-run metadata permission"
              echo
              echo "The caller grants \`actions: read\`; CodeQL can read workflow-run metadata during analysis finalization."
            } >> "$GITHUB_STEP_SUMMARY"
          elif grep -Eq 'HTTP 403|Resource not accessible by integration' <<< "$output"; then
            echo "has_actions_read=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=CodeQL workflow-run metadata permission missing::Grant actions: read in the caller workflow for full CodeQL finalization. This run will keep the SARIF artifact path available when CodeQL can export results."
          else
            echo "::error title=Workflow-run metadata probe failed::Unable to determine whether the caller grants actions: read. Failing closed so transient API errors do not mask real CodeQL failures."
            printf '%s\n' "$output"
            exit 1
          fi

      - name: Perform CodeQL Analysis
        id: codeql-analysis
        continue-on-error: ${{ steps.workflow-run-permission.outputs.has_actions_read != 'true' }}
        uses: github/codeql-action/analyze@v4
        with:
          category: nightly-sast
          output: ${{ inputs.working-directory }}/security-reports
          upload: never

      - name: Verify degraded CodeQL SARIF output
        if: steps.workflow-run-permission.outputs.has_actions_read != 'true' && steps.codeql-analysis.outcome == 'failure'
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          if find ./security-reports -type f -name '*.sarif' | grep -q .; then
            echo "CodeQL produced SARIF before the workflow-run metadata finalization failure."
          else
            echo "::error title=CodeQL analysis failed before SARIF export::The caller is missing actions: read, but CodeQL did not produce a SARIF report. Treating this as a real analysis failure rather than degraded finalization."
            exit 1
          fi

      - name: Report degraded CodeQL finalization
        if: steps.workflow-run-permission.outputs.has_actions_read != 'true' && steps.codeql-analysis.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## CodeQL analysis finalization degraded"
            echo
            echo "The caller workflow does not grant \`actions: read\`, so CodeQL could not read workflow-run metadata while finalizing analysis."
            echo "Add \`actions: read\` to the caller workflow permissions for full scheduled CodeQL status reporting."
            echo "CodeQL produced SARIF before finalization failed, so the workflow continues and uploads scanner artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Filter generated-code findings from SARIF
        uses: ./.github/actions-repo/.github/actions/security/filter-sarif
        with:
          sarif-dir: ${{ inputs.working-directory }}/security-reports

      - name: Upload filtered SARIF
        id: upload-filtered-sarif
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ inputs.working-directory }}/security-reports
          category: nightly-sast
          wait-for-processing: true

      - name: Report degraded SAST SARIF upload
        if: steps.upload-filtered-sarif.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=CodeQL SARIF upload skipped::Filtered SAST SARIF could not be uploaded to GitHub Code Scanning. The SARIF artifact is still retained for offline review."
          {
            echo "## CodeQL SARIF upload degraded"
            echo
            echo "Filtered SAST SARIF could not be uploaded to GitHub Code Scanning."
            echo "This is expected for repositories without GitHub Code Security/code scanning enabled."
            echo "The workflow still uploads the SARIF artifact as \`sast-report\` for offline review."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sast-report
          path: ${{ inputs.working-directory }}/security-reports/**/*
          if-no-files-found: error
          retention-days: 90
  
  secret-scan:
    name: Full Codebase Secret Scan
    if: ${{ inputs.enable-secret-scan }}
    runs-on: ${{ inputs.runs-on }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout HoneyDrunk.Actions (shared gitleaks config)
        uses: actions/checkout@v5
        with:
          repository: HoneyDrunkStudios/HoneyDrunk.Actions
          path: .github/actions-repo
          ref: ${{ inputs.actions-ref }}

      - name: Create reports directory
        shell: bash
        run: mkdir -p ./security-reports

      - name: Resolve gitleaks config
        id: gitleaks-config
        shell: bash
        run: |
          if [ -f ".gitleaks.toml" ]; then
            echo "Using repo-local .gitleaks.toml"
            echo "path=.gitleaks.toml" >> $GITHUB_OUTPUT
          else
            echo "Using shared HoneyDrunk.Actions gitleaks config"
            echo "path=.github/actions-repo/.github/config/gitleaks.toml" >> $GITHUB_OUTPUT
          fi

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.21.2"
          GITLEAKS_TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          GITLEAKS_BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl -sSfL "${GITLEAKS_BASE_URL}/${GITLEAKS_TARBALL}" -o "/tmp/${GITLEAKS_TARBALL}"
          curl -sSfL "${GITLEAKS_BASE_URL}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks_checksums.txt

          cd /tmp
          grep "  ${GITLEAKS_TARBALL}$" gitleaks_checksums.txt | sha256sum -c -
          tar -xzf "${GITLEAKS_TARBALL}" -C /tmp gitleaks
          cd -

          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks full-history scan
        shell: bash
        run: |
          set -euo pipefail
          gitleaks detect \
            --source . \
            --config "${{ steps.gitleaks-config.outputs.path }}" \
            --report-format sarif \
            --report-path ./security-reports/secrets-scan.sarif \
            --redact \
            --exit-code 0 \
            --log-level info 2>&1 | tee ./security-reports/gitleaks.log

      - name: Upload secrets SARIF to GitHub Security
        if: always() && hashFiles('./security-reports/secrets-scan.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ./security-reports/secrets-scan.sarif
          category: nightly-secrets

      - name: Upload secret scan report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: secret-scan-report
          path: ./security-reports/**/*
          if-no-files-found: error
          retention-days: 90
  
  iac-security-scan:
    name: Infrastructure as Code Security Scan
    outputs:
      has-iac: ${{ steps.detect.outputs.has_iac }}
    if: ${{ inputs.enable-iac-scan }}
    runs-on: ${{ inputs.runs-on }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Detect IaC files
        id: detect
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path

          def fail_detection(error):
              raise error

          found = False
          for root, directories, files in os.walk('.', onerror=fail_detection):
              directories[:] = [name for name in directories if name != '.git']
              for name in files:
                  path = Path(root) / name
                  if path.suffix in {'.tf', '.tfvars', '.bicep'} or name.startswith(('Dockerfile', 'docker-compose')):
                      found = True
                  elif path.suffix in {'.json', '.yaml', '.yml'}:
                      content = path.read_text(encoding='utf-8')
                      if 'Microsoft.Resources' in content or (path.suffix != '.json' and 'apiVersion:' in content):
                          found = True
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'has_iac={str(found).lower()}\n')
          print('IaC targets detected' if found else 'No IaC targets detected')
          PYTHON

      - name: Run IaC security scan
        if: steps.detect.outputs.has_iac == 'true'
        id: iac-scan
        shell: bash
        run: |
          mkdir -p ./security-reports

          echo "Running Trivy filesystem scan for IaC misconfigurations..."
          docker run --rm \
            -v "$(pwd):/workspace" \
            aquasec/trivy:0.69.3 fs /workspace \
            --scanners misconfig \
            --format sarif \
            --output /workspace/security-reports/iac-trivy.sarif \
            --severity MEDIUM,HIGH,CRITICAL \
            --exit-code 0 2>&1 | tee ./security-reports/trivy.log

      - name: Upload IaC SARIF to GitHub Security
        if: steps.detect.outputs.has_iac == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ./security-reports/iac-trivy.sarif
          category: nightly-iac
      
      - name: Upload IaC scan report
        if: always() && steps.detect.outputs.has_iac == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: iac-security-report
          path: ./security-reports/**/*
          if-no-files-found: error
          retention-days: 90
  
  consolidate-and-report:
    name: Consolidate Security Reports
    needs: [dependency-scan, sast-analysis, secret-scan, iac-security-scan]
    if: always()
    runs-on: ${{ inputs.runs-on }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Checkout HoneyDrunk.Actions
        uses: actions/checkout@v5
        with:
          repository: HoneyDrunkStudios/HoneyDrunk.Actions
          path: .github/actions-repo
          ref: ${{ inputs.actions-ref }}

      - name: Download all security reports
        if: always()
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          path: ./all-security-reports

      - name: Consolidate security findings
        if: always()
        id: consolidate
        shell: bash
        env:
          DEPENDENCY_RESULT: ${{ needs.dependency-scan.result }}
          SAST_RESULT: ${{ needs.sast-analysis.result }}
          SECRET_RESULT: ${{ needs.secret-scan.result }}
          IAC_RESULT: ${{ needs.iac-security-scan.result }}
          ENABLE_SAST: ${{ inputs.enable-sast }}
          ENABLE_SECRET_SCAN: ${{ inputs.enable-secret-scan }}
          ENABLE_IAC_SCAN: ${{ inputs.enable-iac-scan }}
          IAC_HAS_TARGETS: ${{ needs.iac-security-scan.outputs.has-iac }}
          FAIL_ON_HIGH_SEVERITY: ${{ inputs.fail-on-high-severity }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: python3 .github/actions-repo/.github/scripts/security-report.py consolidate

      - name: Create GitHub issue for findings
        if: ${{ inputs.create-issues && steps.consolidate.outputs.known_issues > 0 }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.github-token || github.token }}
        run: |
          TOTAL="${{ steps.consolidate.outputs.known_issues }}"
          SCAN_DATE=$(date -u +"%Y-%m-%d")
          TITLE="🔒 Nightly Security Scan - $SCAN_DATE - $TOTAL known findings"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          BODY="$(cat security-summary.md)

          **Run:** $RUN_URL

          Download this run's artifacts for complete findings and execution logs."

          # Check for existing open issue with the security label
          EXISTING=$(gh issue list --label "security,automated" --state open --limit 1 --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body "$BODY"
          else
            echo "Creating new security issue"
            # Ensure labels exist before creating issue
            gh label create "security" --color "d93f0b" --description "Security findings" 2>/dev/null || true
            gh label create "automated" --color "0e8a16" --description "Automated issue" 2>/dev/null || true
            gh issue create \
              --title "$TITLE" \
              --body "$BODY" \
              --label "security,automated"
          fi
      
      - name: Upload consolidated report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: consolidated-security-report
          path: |
            ./consolidated-security-report.*
            ./security-summary.md
          retention-days: 90


      - name: Enforce final security result
        if: always()
        shell: bash
        run: python3 .github/actions-repo/.github/scripts/security-report.py gate
