# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: 'Deploy Container App Revision'
description: 'Create an Azure Container Apps revision and wait for Running state and its revision-specific endpoint'
inputs:
  app-name:
    description: 'Azure Container App name'
    required: true
  resource-group:
    description: 'Azure resource group containing the Container App'
    required: true
  image:
    description: 'Full container image reference to deploy'
    required: true
  revision-suffix:
    description: 'Suffix appended to the new revision name'
    required: true
  startup-wait:
    description: 'Seconds to wait after revision provisioning before downstream probes'
    required: false
    default: '15'
  health-check-timeout:
    description: 'Seconds to poll for Running state and a revision-specific FQDN'
    required: false
    default: '120'
outputs:
  revision-name:
    description: 'Name of the created Container App revision'
    value: ${{ steps.deploy.outputs.revision-name }}
  revision-fqdn:
    description: 'Revision-specific FQDN for the created revision'
    value: ${{ steps.deploy.outputs.revision-fqdn }}
runs:
  using: 'composite'
  steps:
    - name: Create revision and wait until running
      id: deploy
      shell: bash
      env:
        APP_NAME: ${{ inputs.app-name }}
        RESOURCE_GROUP: ${{ inputs.resource-group }}
        IMAGE: ${{ inputs.image }}
        REVISION_SUFFIX: ${{ inputs.revision-suffix }}
        STARTUP_WAIT: ${{ inputs.startup-wait }}
        READY_TIMEOUT: ${{ inputs.health-check-timeout }}
      run: |
        set -euo pipefail

        if [ -z "$APP_NAME" ] || [ -z "$RESOURCE_GROUP" ] || [ -z "$IMAGE" ] || [ -z "$REVISION_SUFFIX" ]; then
          echo "::error::app-name, resource-group, image, and revision-suffix are required"
          exit 1
        fi

        normalize_seconds() {
          local VALUE="$1"
          local INPUT_NAME="$2"
          if [[ ! "$VALUE" =~ ^[0-9]+$ ]]; then
            echo "::error::$INPUT_NAME must be nonnegative decimal seconds" >&2
            return 1
          fi
          # Bash arithmetic treats leading zeros as octal. Normalize before
          # creating a revision and reject values outside signed 64-bit range.
          VALUE=$(printf '%s' "$VALUE" | sed -E 's/^0+//')
          VALUE=${VALUE:-0}
          if [ "${#VALUE}" -gt 19 ] || { [ "${#VALUE}" -eq 19 ] && [[ "$VALUE" > 9223372036854775807 ]]; }; then
            echo "::error::$INPUT_NAME exceeds the supported integer range" >&2
            return 1
          fi
          printf '%s' "$VALUE"
        }
        READY_TIMEOUT=$(normalize_seconds "$READY_TIMEOUT" health-check-timeout)
        STARTUP_WAIT=$(normalize_seconds "$STARTUP_WAIT" startup-wait)

        # Container Apps revision suffixes must be DNS-label friendly and fit within
        # the generated revision name length limit. Keep the caller-provided trace
        # value recognizable while removing unsupported characters.
        SAFE_SUFFIX=$(echo "$REVISION_SUFFIX" \
          | tr '[:upper:]' '[:lower:]' \
          | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g' \
          | cut -c1-40)
        if [ -z "$SAFE_SUFFIX" ]; then
          echo "::error::revision-suffix must contain at least one alphanumeric character"
          exit 1
        fi

        echo "Creating Container App revision for $APP_NAME with suffix $SAFE_SUFFIX"
        # NOTE: `az containerapp revision copy` returns the Container *App*
        # object (its .name is the app name), NOT the new revision — so we must
        # not read the revision name from its output. With --revision-suffix the
        # new revision is deterministically named "<app>--<suffix>".
        az containerapp revision copy \
          --name "$APP_NAME" \
          --resource-group "$RESOURCE_GROUP" \
          --image "$IMAGE" \
          --revision-suffix "$SAFE_SUFFIX" \
          --output none

        # SAFE_SUFFIX is already validated non-empty above and APP_NAME is a
        # required input, so REVISION_NAME is guaranteed non-empty here.
        REVISION_NAME="${APP_NAME}--${SAFE_SUFFIX}"

        echo "Created revision: $REVISION_NAME"

        INTERVAL=5
        ELAPSED=0
        RUNNING_STATE=""
        REVISION_FQDN=""

        while [ "$ELAPSED" -le "$READY_TIMEOUT" ]; do
          REVISION_JSON=$(az containerapp revision show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --revision "$REVISION_NAME" \
            --output json)

          RETURNED_NAME=$(echo "$REVISION_JSON" | jq -r '.name // empty')
          if [ "$RETURNED_NAME" != "$REVISION_NAME" ]; then
            echo "::error::Revision lookup did not return the requested revision '$REVISION_NAME'"
            exit 1
          fi

          RUNNING_STATE=$(echo "$REVISION_JSON" | jq -r '.properties.runningState // .properties.healthState // empty')
          REVISION_FQDN=$(echo "$REVISION_JSON" | jq -r '.properties.fqdn // .fqdn // empty')

          # App ingress can still serve the previous revision in Multiple mode.
          # Only the named candidate's direct hostname is safe for downstream probes.
          if [ -n "$REVISION_FQDN" ] && { [[ "$REVISION_FQDN" != "$REVISION_NAME".* ]] \
            || [[ ! "$REVISION_FQDN" =~ ^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; }; then
            echo "::error::Revision '$REVISION_NAME' returned an invalid or non-matching revision FQDN"
            exit 1
          fi

          if [ "$RUNNING_STATE" = "Running" ] && [ -n "$REVISION_FQDN" ]; then
            echo "Revision is Running with a revision-specific FQDN"
            break
          fi

          if [ "$ELAPSED" -ge "$READY_TIMEOUT" ]; then
            break
          fi
          WAIT=$((READY_TIMEOUT - ELAPSED))
          if [ "$WAIT" -gt "$INTERVAL" ]; then
            WAIT=$INTERVAL
          fi
          echo "Waiting for Running state and revision FQDN (state: ${RUNNING_STATE:-unknown}); retrying in ${WAIT}s..."
          sleep "$WAIT"
          ELAPSED=$((ELAPSED + WAIT))
        done

        if [ "$RUNNING_STATE" != "Running" ]; then
          echo "::error::Revision '$REVISION_NAME' did not reach Running state within ${READY_TIMEOUT}s"
          exit 1
        fi

        if [ -z "$REVISION_FQDN" ]; then
          echo "::error::Revision '$REVISION_NAME' did not expose a revision-specific FQDN within ${READY_TIMEOUT}s; refusing to use app ingress"
          exit 1
        fi

        if [ "$STARTUP_WAIT" -gt 0 ]; then
          echo "Waiting ${STARTUP_WAIT}s for revision startup"
          sleep "$STARTUP_WAIT"
        fi

        echo "revision-name=$REVISION_NAME" >> "$GITHUB_OUTPUT"
        echo "revision-fqdn=$REVISION_FQDN" >> "$GITHUB_OUTPUT"
