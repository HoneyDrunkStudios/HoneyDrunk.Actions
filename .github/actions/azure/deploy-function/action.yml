# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: 'Deploy to Azure Function App'
description: 'Deploy a published .NET project to Azure Function App with optional slot swap support'
inputs:
  app-name:
    description: 'Azure Function App name'
    required: true
  resource-group:
    description: 'Azure resource group containing the Function App'
    required: true
  package-path:
    description: 'Path to the published function app package (zip file or directory)'
    required: true
  slot-name:
    description: 'Deployment slot name. Use "production" for direct production deploy.'
    required: false
    default: 'production'
  swap-to-production:
    description: 'Swap the deployed slot to production after deployment (ignored when slot-name is "production")'
    required: false
    default: 'false'
  health-check-url:
    description: 'URL to probe after deployment (relative path like /api/health, or full URL). Empty to skip.'
    required: false
    default: ''
  health-check-timeout:
    description: 'Maximum seconds to wait for health check to pass'
    required: false
    default: '120'
  startup-wait:
    description: 'Seconds to wait for function app startup before health check'
    required: false
    default: '30'
outputs:
  deployed-url:
    description: 'URL of the deployed Function App (slot URL if not swapped, production URL if swapped)'
    value: ${{ steps.post-swap-url.outputs.url || steps.resolve-url.outputs.url }}
  deployment-status:
    description: 'Final deployment status: succeeded, swapped, or failed'
    value: ${{ steps.final-status.outputs.status }}
runs:
  using: 'composite'
  steps:
    - name: Deploy function app
      id: deploy
      shell: bash
      env:
        APP_NAME: ${{ inputs.app-name }}
        RESOURCE_GROUP: ${{ inputs.resource-group }}
        SLOT: ${{ inputs.slot-name }}
        PACKAGE_PATH: ${{ inputs.package-path }}
      run: |
        set -euo pipefail

        # Deploy with the Azure CLI directly rather than a marketplace action
        # (invariant 38: reusable workflows invoke tool CLIs directly when a stable CLI
        # exists; azure/functions-action wraps `az functionapp ... config-zip`). This also
        # removes the external dependency that broke all Function deploys when GitHub
        # ToS-blocked the Azure/functions-action repo (2026-06-05).
        #
        # `config-zip` is the one-deploy path for Flex Consumption and zip-deploy for
        # classic plans. package-path is the downloaded publish directory; zip it
        # (including hidden dirs like .azurefunctions, required for Flex) into a .zip.
        PKG="$PACKAGE_PATH"
        if [ -d "$PKG" ]; then
          ZIP="${RUNNER_TEMP:-/tmp}/functionapp-deploy.zip"
          rm -f "$ZIP"
          ( cd "$PKG" && zip -r -q "$ZIP" . )
          PKG="$ZIP"
        fi

        SLOT_ARGS=()
        if [ "$SLOT" != "production" ] && [ -n "$SLOT" ]; then
          SLOT_ARGS=(--slot "$SLOT")
        fi

        # Retry once for transient post-upload status-poll blips.
        attempt=1
        max=2
        while true; do
          if timeout 600 az functionapp deployment source config-zip \
               --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" "${SLOT_ARGS[@]}" \
               --src "$PKG" --output none; then
            echo "Deployed '$PKG' to '$APP_NAME' ${SLOT_ARGS[*]:-(production)}"
            break
          fi
          if [ "$attempt" -ge "$max" ]; then
            echo "::error::az functionapp deployment source config-zip failed after ${attempt} attempt(s)"
            exit 1
          fi
          echo "::warning::Deploy attempt ${attempt} failed; retrying in 15s..."
          attempt=$((attempt + 1))
          sleep 15
        done

    - name: Resolve deployed URL
      id: resolve-url
      shell: bash
      run: |
        set -euo pipefail
        APP_NAME="${{ inputs.app-name }}"
        SLOT="${{ inputs.slot-name }}"
        RG="${{ inputs.resource-group }}"

        # Resolve the real hostname from Azure rather than assuming the bare
        # "<name>.azurewebsites.net" form. Flex Consumption function apps answer
        # ONLY on a regional hostname ("<name>-<hash>.<region>-01.azurewebsites.net"),
        # so the bare form returns no response (HTTP 000) and fails the health
        # check even when the deploy succeeded.
        #
        # NOTE: use `az resource show` (generic ARM), NOT `az functionapp show` —
        # the latter returns null for defaultHostName/state/hostNames on Flex
        # Consumption apps (a CLI quirk), which would silently trigger the fallback.
        # `az resource show` reads the property straight from ARM and is correct for
        # both Flex and classic plans.
        if [ "$SLOT" == "production" ] || [ -z "$SLOT" ]; then
          HOST=$(az resource show --resource-group "$RG" --name "$APP_NAME" --resource-type Microsoft.Web/sites --query properties.defaultHostName -o tsv 2>/dev/null || true)
          FALLBACK="${APP_NAME}.azurewebsites.net"
        else
          HOST=$(az resource show --resource-group "$RG" --namespace Microsoft.Web --parent "sites/$APP_NAME" --resource-type slots --name "$SLOT" --query properties.defaultHostName -o tsv 2>/dev/null || true)
          FALLBACK="${APP_NAME}-${SLOT}.azurewebsites.net"
        fi

        if [ -z "$HOST" ]; then
          # Lookup failed (most likely the Azure CLI isn't authenticated). Fall
          # back to the constructed hostname so a no-health-check caller still
          # gets a best-effort deployed-url, but warn loudly: for Flex Consumption
          # that fallback is NOT a configured hostname, so a health check against
          # it will false-negative. Accurate resolution requires Azure CLI auth.
          HOST="$FALLBACK"
          echo "::warning::Could not resolve defaultHostName for ${APP_NAME} via 'az resource show' (is the Azure CLI authenticated?). Falling back to ${HOST} — this is NOT a configured hostname for Flex Consumption apps, so a health check against it may false-negative."
        fi
        echo "url=https://${HOST}" >> "$GITHUB_OUTPUT"

    - name: Wait for function app startup
      if: ${{ inputs.health-check-url != '' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "Waiting ${{ inputs.startup-wait }}s for function app startup..."
        sleep ${{ inputs.startup-wait }}

    - name: Health check
      id: health-check
      if: ${{ inputs.health-check-url != '' }}
      shell: bash
      run: |
        set -euo pipefail
        BASE_URL="${{ steps.resolve-url.outputs.url }}"
        HEALTH_PATH="${{ inputs.health-check-url }}"
        TIMEOUT=${{ inputs.health-check-timeout }}

        if [[ "$HEALTH_PATH" == http* ]]; then
          HEALTH_URL="$HEALTH_PATH"
        else
          HEALTH_URL="${BASE_URL}${HEALTH_PATH}"
        fi

        echo "Probing ${HEALTH_URL} (timeout: ${TIMEOUT}s)..."

        ELAPSED=0
        INTERVAL=5
        while [ $ELAPSED -lt $TIMEOUT ]; do
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$HEALTH_URL" 2>/dev/null || echo "000")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
            echo "Health check passed (HTTP ${HTTP_CODE})"
            echo "healthy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "  HTTP ${HTTP_CODE} — retrying in ${INTERVAL}s..."
          sleep $INTERVAL
          ELAPSED=$((ELAPSED + INTERVAL))
        done

        echo "::error::Health check failed after ${TIMEOUT}s"
        echo "healthy=false" >> "$GITHUB_OUTPUT"
        exit 1

    - name: Swap slot to production
      if: ${{ inputs.slot-name != 'production' && inputs.swap-to-production == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "Swapping slot '${{ inputs.slot-name }}' → production..."
        az functionapp deployment slot swap \
          --resource-group "${{ inputs.resource-group }}" \
          --name "${{ inputs.app-name }}" \
          --slot "${{ inputs.slot-name }}" \
          --target-slot "production"
        echo "Swap complete."

    - name: Update URL after swap
      if: ${{ inputs.slot-name != 'production' && inputs.swap-to-production == 'true' }}
      id: post-swap-url
      shell: bash
      run: |
        set -euo pipefail
        # Resolve the production hostname from Azure (see "Resolve deployed URL"):
        # `az resource show`, not `az functionapp show` (null on Flex Consumption).
        HOST=$(az resource show --resource-group "${{ inputs.resource-group }}" --name "${{ inputs.app-name }}" --resource-type Microsoft.Web/sites --query properties.defaultHostName -o tsv 2>/dev/null || true)
        if [ -z "$HOST" ]; then
          HOST="${{ inputs.app-name }}.azurewebsites.net"
          echo "::warning::Could not resolve defaultHostName for ${{ inputs.app-name }} via 'az resource show'; falling back to ${HOST}, which may not route for Flex Consumption apps."
        fi
        echo "url=https://${HOST}" >> "$GITHUB_OUTPUT"

    - name: Final status
      id: final-status
      shell: bash
      run: |
        set -euo pipefail
        SLOT="${{ inputs.slot-name }}"
        SWAP="${{ inputs.swap-to-production }}"

        if [ "$SLOT" == "production" ]; then
          echo "status=succeeded" >> "$GITHUB_OUTPUT"
          echo "✅ Deployed directly to production"
        elif [ "$SWAP" == "true" ]; then
          echo "status=swapped" >> "$GITHUB_OUTPUT"
          echo "✅ Deployed to ${SLOT} and swapped to production"
        else
          echo "status=succeeded" >> "$GITHUB_OUTPUT"
          echo "✅ Deployed to slot: ${SLOT}"
        fi
