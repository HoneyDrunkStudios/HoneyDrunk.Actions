# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: 'Check API Compatibility'
description: 'Check public API surface for breaking changes by comparing assembly APIs against a baseline'
inputs:
  working-directory:
    description: 'Working directory containing the .NET solution or project'
    required: false
    default: '.'
  project-path:
    description: 'Path to a specific project or solution file (auto-detected if empty)'
    required: false
    default: ''
  baseline-ref:
    description: 'Git ref to compare against (e.g., main, origin/main)'
    required: false
    default: 'origin/main'
  baseline-path:
    description: 'Legacy text baseline path (unsupported; use baseline-ref for compiled contract comparison)'
    required: false
    default: ''
  output-directory:
    description: 'Directory for compatibility report output'
    required: false
    default: './api-compat-reports'
  fail-on-breaking:
    description: 'Fail if breaking changes are detected'
    required: false
    default: 'true'
outputs:
  breaking-changes:
    description: 'Number of breaking changes detected'
    value: ${{ steps.compare.outputs.breaking-changes }}
  report-path:
    description: 'Path to the compatibility report'
    value: ${{ steps.compare.outputs.report-path }}
runs:
  using: 'composite'
  steps:
    - name: Read baseline SDK pin
      id: baseline-sdk
      if: inputs.baseline-path == ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        API_BASELINE_REF: ${{ inputs.baseline-ref }}
      run: python3 "${{ github.action_path }}/prepare-sdk.py"

    - name: Install baseline SDK
      if: steps.baseline-sdk.outputs.global-json != ''
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: ${{ steps.baseline-sdk.outputs.global-json }}

    - name: Install pinned ApiCompat SDK and runtime
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '11.0.100'

    - name: Compare compiled public contracts
      id: compare
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        API_PROJECT: ${{ inputs.project-path }}
        API_BASELINE_REF: ${{ inputs.baseline-ref }}
        API_BASELINE_PATH: ${{ inputs.baseline-path }}
        API_OUTPUT: ${{ inputs.output-directory }}
        API_FAIL_ON_BREAKING: ${{ inputs.fail-on-breaking }}
      run: python3 "${{ github.action_path }}/check.py"
